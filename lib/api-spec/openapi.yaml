openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Life Simulation API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: simulation
    description: Simulation control
  - name: agents
    description: Agent operations
  - name: businesses
    description: Business operations
  - name: goods
    description: Goods operations
  - name: government
    description: Government operations
  - name: config
    description: Configuration operations
  - name: stats
    description: Statistics operations
  - name: decisions
    description: Daily mayor decisions
  - name: districts
    description: District model operations
  - name: mayor-office
    description: Mayor private office operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /simulation/start:
    post:
      operationId: startSimulation
      tags: [simulation]
      summary: Start the simulation
      responses:
        "200":
          description: Simulation started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulationState"

  /simulation/stop:
    post:
      operationId: stopSimulation
      tags: [simulation]
      summary: Stop the simulation
      responses:
        "200":
          description: Simulation stopped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulationState"

  /simulation/continue:
    post:
      operationId: continueSimulation
      tags: [simulation]
      summary: Continue after a final outcome
      responses:
        "200":
          description: Simulation continued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulationState"

  /simulation/reset:
    post:
      operationId: resetSimulation
      tags: [simulation]
      summary: Reset the simulation and generate a new population
      responses:
        "200":
          description: Simulation reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulationState"

  /simulation/new-game:
    post:
      operationId: newGame
      tags: [simulation]
      summary: Start a new game scenario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewGameRequest"
      responses:
        "200":
          description: New game started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulationState"
        "400":
          description: Invalid new game options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /simulation/state:
    get:
      operationId: getSimulationState
      tags: [simulation]
      summary: Get current simulation state with aggregated statistics
      responses:
        "200":
          description: Current simulation state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulationState"

  /decisions/day:
    get:
      operationId: getDailyDecisions
      tags: [decisions]
      summary: Get current daily decisions state
      responses:
        "200":
          description: Daily decisions state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyDecisionsState"

  /decisions/issue:
    post:
      operationId: issueDailyDecision
      tags: [decisions]
      summary: Issue a daily decision decree
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueDailyDecisionRequest"
      responses:
        "200":
          description: Updated daily decisions state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyDecisionsState"
        "400":
          description: Invalid decision payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Decision cannot be issued now
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /decisions/requests:
    get:
      operationId: getResidentRequests
      tags: [decisions]
      summary: Get active resident requests
      responses:
        "200":
          description: Resident requests queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResidentRequestsState"

  /decisions/requests/process:
    post:
      operationId: processResidentRequest
      tags: [decisions]
      summary: Help or decline a resident request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcessResidentRequestRequest"
      responses:
        "200":
          description: Updated resident requests queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResidentRequestsState"
        "400":
          description: Invalid resident request payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Resident request cannot be processed now
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /districts:
    get:
      operationId: listDistricts
      tags: [districts]
      summary: Get permanent district list
      responses:
        "200":
          description: List of districts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/District"

  /districts/{id}:
    get:
      operationId: getDistrict
      tags: [districts]
      summary: Get district by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: District
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/District"
        "404":
          description: District not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /districts/{id}/hire:
    post:
      operationId: hireDistrictStaff
      tags: [districts]
      summary: Hire unemployed residents into a district service
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DistrictHireRequest"
      responses:
        "200":
          description: Updated district
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/District"
        "400":
          description: Invalid hire payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: District not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Hire unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /districts/{id}/invest:
    post:
      operationId: investDistrict
      tags: [districts]
      summary: Invest in a district metric
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DistrictInvestmentRequest"
      responses:
        "200":
          description: Updated district
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/District"
        "400":
          description: Invalid investment payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: District not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Investment unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /district-incidents:
    get:
      operationId: listDistrictIncidents
      tags: [districts]
      summary: Get district incidents
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/DistrictIncidentStatus"
      responses:
        "200":
          description: List of district incidents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DistrictIncident"

  /district-incidents/{id}:
    get:
      operationId: getDistrictIncident
      tags: [districts]
      summary: Get district incident by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: District incident
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DistrictIncident"
        "404":
          description: District incident not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /district-incidents/{id}/respond:
    post:
      operationId: respondDistrictIncident
      tags: [districts]
      summary: Respond to an active district incident
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: District incident response result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DistrictIncidentActionResponse"
        "404":
          description: District incident not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: District incident cannot be resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /district-incidents/{id}/ignore:
    post:
      operationId: ignoreDistrictIncident
      tags: [districts]
      summary: Ignore an active district incident
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: District incident ignore result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DistrictIncidentActionResponse"
        "404":
          description: District incident not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: District incident cannot be ignored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /mayor-office:
    get:
      operationId: getMayorOffice
      tags: [mayor-office]
      summary: Get mayor private office state
      responses:
        "200":
          description: Mayor private office state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MayorOfficeState"

  /mayor-office/skim-city-budget:
    post:
      operationId: skimMayorOfficeCityBudget
      tags: [mayor-office]
      summary: Skim city budget into the mayor offshore office
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MayorOfficeSkimCityBudgetRequest"
      responses:
        "200":
          description: Updated mayor private office state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MayorOfficeState"
        "400":
          description: Invalid operation payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Operation cannot be applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "501":
          description: Operation mechanics are not implemented yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /mayor-office/skim-service-budget:
    post:
      operationId: skimMayorOfficeServiceBudget
      tags: [mayor-office]
      summary: Skim district service budget into the mayor offshore office
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MayorOfficeSkimServiceBudgetRequest"
      responses:
        "200":
          description: Updated mayor private office state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MayorOfficeState"
        "400":
          description: Invalid operation payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Operation cannot be applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "501":
          description: Operation mechanics are not implemented yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /mayor-office/provide-service:
    post:
      operationId: provideMayorOfficeService
      tags: [mayor-office]
      summary: Provide a private mayor office service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MayorOfficeProvideServiceRequest"
      responses:
        "200":
          description: Updated mayor private office state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MayorOfficeState"
        "400":
          description: Invalid operation payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Operation cannot be applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "501":
          description: Operation mechanics are not implemented yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /mayor-office/purchase:
    post:
      operationId: purchaseMayorOffice
      tags: [mayor-office]
      summary: Purchase a mayor private office upgrade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MayorOfficePurchaseRequest"
      responses:
        "200":
          description: Updated mayor private office state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MayorOfficeState"
        "400":
          description: Invalid purchase payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Purchase cannot be applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "501":
          description: Purchase mechanics are not implemented yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /agents:
    get:
      operationId: listAgents
      tags: [agents]
      summary: Get paginated list of agents
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [name, age, mood, money, currentAction]
        - name: sortDir
          in: query
          schema:
            type: string
            enum: [asc, desc]
        - name: filterAction
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of agents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentListResponse"

  /agents/{id}:
    get:
      operationId: getAgent
      tags: [agents]
      summary: Get agent profile with needs and relations
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Agent profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentDetail"
        "404":
          description: Agent not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /businesses:
    get:
      operationId: listBusinesses
      tags: [businesses]
      summary: Get list of businesses
      responses:
        "200":
          description: List of businesses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Business"

  /goods:
    get:
      operationId: listGoods
      tags: [goods]
      summary: Get list of goods with prices
      responses:
        "200":
          description: List of goods
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Good"

  /government:
    get:
      operationId: getGovernment
      tags: [government]
      summary: Get government finances
      responses:
        "200":
          description: Government state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GovernmentState"

  /config:
    get:
      operationId: getConfig
      tags: [config]
      summary: Get current simulation configuration
      responses:
        "200":
          description: Current config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimConfig"
    put:
      operationId: updateConfig
      tags: [config]
      summary: Update simulation configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimConfigUpdate"
      responses:
        "200":
          description: Updated config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimConfig"

  /stats/history:
    get:
      operationId: getStatsHistory
      tags: [stats]
      summary: Get history of aggregated metrics
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Stats history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StatsSnapshot"

  /stats/summary:
    get:
      operationId: getStatsSummary
      tags: [stats]
      summary: Get current summary statistics
      responses:
        "200":
          description: Summary statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsSummary"

  /stats/top-agents:
    get:
      operationId: getTopAgents
      tags: [stats]
      summary: Get top agents by wealth and mood
      responses:
        "200":
          description: Top agents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopAgentsResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    MayorOfficeRiskLevel:
      type: string
      enum: [low, rising, danger]

    MayorOfficeOperationType:
      type: string
      enum: [skim_city_budget, skim_service_budget, provide_service, purchase, system]

    MayorOfficeActionLevel:
      type: string
      enum: [minimal, medium, maximum]

    MayorOfficePurchaseType:
      type: string
      enum: [private_security, professional_security, villa, expensive_car, luxury]

    MayorOfficeOperation:
      type: object
      properties:
        id:
          type: string
        day:
          type: integer
        tick:
          type: integer
        type:
          $ref: "#/components/schemas/MayorOfficeOperationType"
        title:
          type: string
        amount:
          type: number
        offshoreDelta:
          type: number
        corruptionDelta:
          type: number
        riskDelta:
          type: number
      required:
        - id
        - day
        - tick
        - type
        - title
        - amount
        - offshoreDelta
        - corruptionDelta
        - riskDelta

    MayorOfficeDealLevels:
      type: object
      properties:
        minimal:
          type: number
        medium:
          type: number
        maximum:
          type: number
      required:
        - minimal
        - medium
        - maximum

    MayorOfficeDeal:
      type: object
      properties:
        id:
          type: string
        districtId:
          type: string
        title:
          type: string
        levels:
          $ref: "#/components/schemas/MayorOfficeDealLevels"
      required:
        - id
        - districtId
        - title
        - levels

    MayorOfficePurchase:
      type: object
      properties:
        item:
          $ref: "#/components/schemas/MayorOfficePurchaseType"
        title:
          type: string
        cost:
          type: number
        securityDelta:
          type: integer
        securityDurationDays:
          type: integer
        luxuryDelta:
          type: integer
        statusDelta:
          type: integer
        corruptionDelta:
          type: number
        povertyBacklash:
          type: boolean
      required:
        - item
        - title
        - cost
        - securityDelta
        - securityDurationDays
        - luxuryDelta
        - statusDelta
        - corruptionDelta
        - povertyBacklash

    MayorOfficeState:
      type: object
      properties:
        offshoreBalance:
          type: number
        corruption:
          type: number
        securityLevel:
          type: integer
        securityExpiresTick:
          type:
            - integer
            - "null"
        securityTicksRemaining:
          type: integer
        luxuryLevel:
          type: integer
        statusLevel:
          type: integer
        riskLevel:
          $ref: "#/components/schemas/MayorOfficeRiskLevel"
        deals:
          type: array
          items:
            $ref: "#/components/schemas/MayorOfficeDeal"
        purchases:
          type: array
          items:
            $ref: "#/components/schemas/MayorOfficePurchase"
        operations:
          type: array
          items:
            $ref: "#/components/schemas/MayorOfficeOperation"
      required:
        - offshoreBalance
        - corruption
        - securityLevel
        - securityExpiresTick
        - securityTicksRemaining
        - luxuryLevel
        - statusLevel
        - riskLevel
        - deals
        - purchases
        - operations

    MayorOfficeSkimCityBudgetRequest:
      type: object
      properties:
        level:
          $ref: "#/components/schemas/MayorOfficeActionLevel"
      required:
        - level

    MayorOfficeSkimServiceBudgetRequest:
      type: object
      properties:
        districtId:
          type: string
        service:
          $ref: "#/components/schemas/DistrictServiceType"
        level:
          $ref: "#/components/schemas/MayorOfficeActionLevel"
      required:
        - districtId
        - service
        - level

    MayorOfficeProvideServiceRequest:
      type: object
      properties:
        districtId:
          type: string
        dealId:
          type: string
        level:
          $ref: "#/components/schemas/MayorOfficeActionLevel"
      required:
        - districtId
        - dealId
        - level

    MayorOfficePurchaseRequest:
      type: object
      properties:
        item:
          $ref: "#/components/schemas/MayorOfficePurchaseType"
      required:
        - item

    DistrictMetrics:
      type: object
      properties:
        safety:
          type: number
          description: Public safety, 0-100
        comfort:
          type: number
          description: Everyday comfort, 0-100
        accidentRisk:
          type: number
          description: Incident and failure risk, 0-100
        mayorReputationResidents:
          type: number
          description: Mayor reputation among district residents, 0-100
        businessTrust:
          type: number
          description: Business trust in the district, 0-100
        poverty:
          type: number
          description: Poverty level, 0-100
        infrastructure:
          type: number
          description: Infrastructure condition, 0-100
      required:
        - safety
        - comfort
        - accidentRisk
        - mayorReputationResidents
        - businessTrust
        - poverty
        - infrastructure

    DistrictServiceType:
      type: string
      enum: [utility, police, fire]

    DistrictInvestmentType:
      type: string
      enum: [beautification, safety, infrastructure, business_zone, social_support]

    DistrictInvestmentRequest:
      type: object
      properties:
        type:
          $ref: "#/components/schemas/DistrictInvestmentType"
      required:
        - type

    DistrictIncidentType:
      type: string
      enum: [fire, protest, utility_failure, staff_quit]

    DistrictIncidentStatus:
      type: string
      enum: [active, resolved, ignored, expired]

    DistrictIncident:
      type: object
      properties:
        id:
          type: string
        districtId:
          type: string
        type:
          $ref: "#/components/schemas/DistrictIncidentType"
        status:
          $ref: "#/components/schemas/DistrictIncidentStatus"
        createdTick:
          type: integer
        createdDay:
          type: integer
        deadlineTick:
          type: integer
        deadlineDay:
          type: integer
        severity:
          type: number
        requiredService:
          oneOf:
            - $ref: "#/components/schemas/DistrictServiceType"
            - type: "null"
        basePenalty:
          type: number
        ignoredPenalty:
          type: number
      required:
        - id
        - districtId
        - type
        - status
        - createdTick
        - createdDay
        - deadlineTick
        - deadlineDay
        - severity
        - requiredService
        - basePenalty
        - ignoredPenalty

    DistrictIncidentActionResponse:
      type: object
      properties:
        incident:
          $ref: "#/components/schemas/DistrictIncident"
        effectiveness:
          type: number
          description: Response effectiveness, 0-1
        reputationDelta:
          type: number
          description: Applied residents reputation delta
        partial:
          type: boolean
          description: True when service staff was below the district baseline
      required:
        - incident
        - effectiveness
        - reputationDelta
        - partial

    DistrictHiringQueueItem:
      type: object
      properties:
        service:
