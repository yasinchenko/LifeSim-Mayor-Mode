openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Life Simulation API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: simulation
    description: Simulation control
  - name: agents
    description: Agent operations
  - name: businesses
    description: Business operations
  - name: goods
    description: Goods operations
  - name: government
    description: Government operations
  - name: config
    description: Configuration operations
  - name: stats
    description: Statistics operations
  - name: decisions
    description: Daily mayor decisions
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /simulation/start:
    post:
      operationId: startSimulation
      tags: [simulation]
      summary: Start the simulation
      responses:
        "200":
          description: Simulation started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulationState"

  /simulation/stop:
    post:
      operationId: stopSimulation
      tags: [simulation]
      summary: Stop the simulation
      responses:
        "200":
          description: Simulation stopped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulationState"

  /simulation/reset:
    post:
      operationId: resetSimulation
      tags: [simulation]
      summary: Reset the simulation and generate a new population
      responses:
        "200":
          description: Simulation reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulationState"

  /simulation/new-game:
    post:
      operationId: newGame
      tags: [simulation]
      summary: Start a new game scenario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewGameRequest"
      responses:
        "200":
          description: New game started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulationState"
        "400":
          description: Invalid new game options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /simulation/state:
    get:
      operationId: getSimulationState
      tags: [simulation]
      summary: Get current simulation state with aggregated statistics
      responses:
        "200":
          description: Current simulation state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulationState"

  /decisions/day:
    get:
      operationId: getDailyDecisions
      tags: [decisions]
      summary: Get current daily decisions state
      responses:
        "200":
          description: Daily decisions state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyDecisionsState"

  /decisions/issue:
    post:
      operationId: issueDailyDecision
      tags: [decisions]
      summary: Issue a daily decision decree
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueDailyDecisionRequest"
      responses:
        "200":
          description: Updated daily decisions state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyDecisionsState"
        "400":
          description: Invalid decision payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Decision cannot be issued now
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /decisions/requests:
    get:
      operationId: getResidentRequests
      tags: [decisions]
      summary: Get active resident requests
      responses:
        "200":
          description: Resident requests queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResidentRequestsState"

  /decisions/requests/process:
    post:
      operationId: processResidentRequest
      tags: [decisions]
      summary: Help or decline a resident request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcessResidentRequestRequest"
      responses:
        "200":
          description: Updated resident requests queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResidentRequestsState"
        "400":
          description: Invalid resident request payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Resident request cannot be processed now
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /agents:
    get:
      operationId: listAgents
      tags: [agents]
      summary: Get paginated list of agents
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [name, age, mood, money, currentAction]
        - name: sortDir
          in: query
          schema:
            type: string
            enum: [asc, desc]
        - name: filterAction
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of agents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentListResponse"

  /agents/{id}:
    get:
      operationId: getAgent
      tags: [agents]
      summary: Get agent profile with needs and relations
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Agent profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentDetail"
        "404":
          description: Agent not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /businesses:
    get:
      operationId: listBusinesses
      tags: [businesses]
      summary: Get list of businesses
      responses:
        "200":
          description: List of businesses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Business"

  /goods:
    get:
      operationId: listGoods
      tags: [goods]
      summary: Get list of goods with prices
      responses:
        "200":
          description: List of goods
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Good"

  /government:
    get:
      operationId: getGovernment
      tags: [government]
      summary: Get government finances
      responses:
        "200":
          description: Government state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GovernmentState"

  /config:
    get:
      operationId: getConfig
      tags: [config]
      summary: Get current simulation configuration
      responses:
        "200":
          description: Current config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimConfig"
    put:
      operationId: updateConfig
      tags: [config]
      summary: Update simulation configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimConfigUpdate"
      responses:
        "200":
          description: Updated config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimConfig"

  /stats/history:
    get:
      operationId: getStatsHistory
      tags: [stats]
      summary: Get history of aggregated metrics
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Stats history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StatsSnapshot"

  /stats/summary:
    get:
      operationId: getStatsSummary
      tags: [stats]
      summary: Get current summary statistics
      responses:
        "200":
          description: Summary statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsSummary"

  /stats/top-agents:
    get:
      operationId: getTopAgents
      tags: [stats]
      summary: Get top agents by wealth and mood
      responses:
        "200":
          description: Top agents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopAgentsResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    SimulationState:
      type: object
      properties:
        tick:
          type: integer
        running:
          type: boolean
        gameHour:
          type: integer
        gameDay:
          type: integer
        scenarioType:
          type: string
          enum: [balanced, crisis, growth, stability]
        goalType:
          type: string
          enum: [balanced, crisis_recovery, economic_growth, social_stability]
        dayLimit:
          type: integer
        daysRemaining:
          type: integer
        gameStatus:
          type: string
          enum: [active, victory, defeat]
        gameOutcomeReason:
          type: ["string", "null"]
        goalProgress:
          type: number
        reputationResidents:
          type: number
        reputationBusiness:
          type: number
        reputationGovernment:
          type: number
        actionPointsRemaining:
          type: integer
        actionPointsMax:
          type: integer
        population:
          type: integer
        avgMood:
          type: number
        gdp:
          type: number
        unemploymentRate:
          type: number
        governmentBudget:
          type: number
        totalTaxCollected:
          type: number
        avgWealth:
          type: number
      required:
        - tick
        - running
        - gameHour
        - gameDay
        - scenarioType
        - goalType
        - dayLimit
        - daysRemaining
        - gameStatus
        - gameOutcomeReason
        - goalProgress
        - reputationResidents
        - reputationBusiness
        - reputationGovernment
        - actionPointsRemaining
        - actionPointsMax
        - population
        - avgMood
        - gdp
        - unemploymentRate
        - governmentBudget
        - totalTaxCollected
        - avgWealth

    NewGameRequest:
      type: object
      properties:
        scenarioType:
          type: string
          enum: [balanced, crisis, growth, stability]
          default: balanced
        goalType:
          type: string
          enum: [balanced, crisis_recovery, economic_growth, social_stability]
          default: balanced
        dayLimit:
          type: integer
          minimum: 7
          maximum: 120
          default: 30

    IssueDailyDecisionRequest:
      type: object
      properties:
        decisionId:
          type: string
      required:
        - decisionId

    DecisionEffect:
      type: object
      properties:
        kind:
          type: string
          enum: [need_decay_multiplier, social_multiplier, tax_delta, subsidy_multiplier, daily_need_delta, daily_business_delta, public_quality_delta, food_supply_delta]
        label:
          type: string
        value:
          type: number
        need:
          type: string
        businessType:
          type: string
      required:
        - kind
        - label
        - value

    DailyDecision:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        side:
          type: string
          enum: [residents, business, government]
        sideLabel:
          type: string
        category:
          type: string
          enum: [social, economy, safety, infrastructure]
        activity:
          type: string
          enum: [resident_requests, budget_session, crisis_staff, business_talks, city_news]
        responseLabel:
          type: string
        description:
          type: string
        impactSummary:
          type: string
        tradeoff:
          type: string
        cardTitle:
          type: string
        eventText:
          type: string
        daySummary:
          type: string
        tone:
          type: string
          enum: [critical, warning, opportunity]
        actionPointCost:
          type: integer
        budgetCost:
          type: number
        cooldownDays:
          type: integer
        delayDays:
          type: integer
        durationDays:
          type: integer
        effects:
          type: array
          items:
            $ref: "#/components/schemas/DecisionEffect"
        canIssue:
          type: boolean
        unavailableReason:
          type: ["string", "null"]
        cooldownRemaining:
          type: integer
      required:
        - id
        - title
        - side
        - sideLabel
        - category
        - activity
        - responseLabel
        - description
        - impactSummary
        - tradeoff
        - cardTitle
        - eventText
        - daySummary
        - tone
        - actionPointCost
        - budgetCost
        - cooldownDays
        - delayDays
        - durationDays
        - effects
        - canIssue
        - unavailableReason
        - cooldownRemaining

    DailyEventCard:
      type: object
      properties:
        id:
          type: string
          enum: [residents, business, government]
        side:
          type: string
          enum: [residents, business, government]
        sideLabel:
          type: string
        title:
          type: string
        eventText:
          type: string
        daySummary:
          type: string
        tone:
          type: string
          enum: [critical, warning, opportunity]
        activity:
          type: string
          enum: [resident_requests, budget_session, crisis_staff, business_talks, city_news]
        decisionIds:
          type: array
          items:
            type: string
      required:
        - id
        - side
        - sideLabel
        - title
        - eventText
        - daySummary
        - tone
        - activity
        - decisionIds

    DailyDecree:
      type: object
      properties:
        id:
          type: integer
        decisionId:
          type: string
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [pending, active, expired]
        issuedDay:
          type: integer
        startDay:
          type: integer
        endDay:
          type: integer
        remainingDays:
          type: integer
        actionPointCost:
          type: integer
        budgetCost:
          type: number
        effects:
          type: array
          items:
            $ref: "#/components/schemas/DecisionEffect"
      required:
        - id
        - decisionId
        - title
        - description
        - status
        - issuedDay
        - startDay
        - endDay
        - remainingDays
        - actionPointCost
        - budgetCost
        - effects

    ActiveDecisionEffect:
      type: object
      properties:
        id:
          type: string
        decisionId:
          type: string
        title:
          type: string
        label:
          type: string
        value:
          type: number
        startDay:
          type: integer
        endDay:
          type: integer
        remainingDays:
          type: integer
      required:
        - id
        - decisionId
        - title
        - label
        - value
        - startDay
        - endDay
        - remainingDays

    FactionDemandOutcome:
      type: object
      properties:
        label:
          type: string
        budgetDelta:
          type: number
        effects:
          type: array
          items:
            $ref: "#/components/schemas/DecisionEffect"
        pressureDelta:
          type: number
      required:
        - label
        - budgetDelta
        - effects
        - pressureDelta

    FactionDemand:
      type: object
      properties:
        id:
          type: string
        side:
          type: string
          enum: [residents, business, government]
        sideLabel:
          type: string
        title:
          type: string
        description:
          type: string
        requirement:
          type: string
        pressure:
          type: number
        createdDay:
          type: integer
        deadlineDay:
          type: integer
        daysRemaining:
          type: integer
        status:
          type: string
          enum: [active, completed, ignored]
        resolvedDay:
          type: ["integer", "null"]
        resolutionLabel:
          type: ["string", "null"]
        reward:
          $ref: "#/components/schemas/FactionDemandOutcome"
        penalty:
          $ref: "#/components/schemas/FactionDemandOutcome"
      required:
        - id
        - side
        - sideLabel
        - title
        - description
        - requirement
        - pressure
        - createdDay
        - deadlineDay
        - daysRemaining
        - status
        - resolvedDay
        - resolutionLabel
        - reward
        - penalty

    FactionPressureBySide:
      type: object
      properties:
        side:
          type: string
          enum: [residents, business, government]
        sideLabel:
          type: string
        pressure:
          type: number
        activeCount:
          type: integer
      required:
        - side
        - sideLabel
        - pressure
        - activeCount

    FactionPressureState:
      type: object
      properties:
        currentDay:
          type: integer
        activeDemands:
          type: array
          items:
            $ref: "#/components/schemas/FactionDemand"
        recentDemands:
          type: array
          items:
            $ref: "#/components/schemas/FactionDemand"
        pressureBySide:
          type: array
          items:
            $ref: "#/components/schemas/FactionPressureBySide"
        completedCount:
          type: integer
        ignoredCount:
          type: integer
      required:
        - currentDay
        - activeDemands
        - recentDemands
        - pressureBySide
        - completedCount
        - ignoredCount

    DailyDecisionsState:
      type: object
      properties:
        currentDay:
          type: integer
        actionPointsRemaining:
          type: integer
        actionPointsMax:
          type: integer
        dailySummary:
          type: string
        hasChosenToday:
          type: boolean
        chosenDecisionId:
          type: ["string", "null"]
        factionPressure:
          $ref: "#/components/schemas/FactionPressureState"
        eventCards:
          type: array
          items:
            $ref: "#/components/schemas/DailyEventCard"
        decisions:
          type: array
          items:
            $ref: "#/components/schemas/DailyDecision"
        activeEffects:
          type: array
          items:
            $ref: "#/components/schemas/ActiveDecisionEffect"
        pendingDecrees:
          type: array
          items:
            $ref: "#/components/schemas/DailyDecree"
        recentDecrees:
          type: array
          items:
            $ref: "#/components/schemas/DailyDecree"
      required:
        - currentDay
        - actionPointsRemaining
        - actionPointsMax
        - dailySummary
        - hasChosenToday
        - chosenDecisionId
        - factionPressure
        - eventCards
        - decisions
        - activeEffects
        - pendingDecrees
        - recentDecrees

    ResidentRequest:
      type: object
      properties:
        id:
          type: string
        agentId:
          type: integer
        residentName:
          type: string
        residentAge:
          type: integer
        district:
          type: string
        category:
          type: string
          enum: [finance, work, food, health, comfort, safety]
        categoryLabel:
          type: string
        problem:
          type: string
        need:
          type: string
        helpCost:
          type: number
        createdTick:
          type: integer
        createdDay:
          type: integer
        canHelp:
          type: boolean
      required:
        - id
        - agentId
        - residentName
        - residentAge
        - district
        - category
        - categoryLabel
        - problem
        - helpCost
        - createdTick
        - createdDay
        - canHelp

    ResidentRequestsState:
      type: object
      properties:
        currentDay:
          type: integer
        pendingCount:
          type: integer
        bufferMax:
          type: integer
        reputationDelta:
          type: number
        requests:
          type: array
          items:
            $ref: "#/components/schemas/ResidentRequest"
      required:
        - currentDay
        - pendingCount
        - bufferMax
        - reputationDelta
        - requests

    ProcessResidentRequestRequest:
      type: object
      properties:
        requestId:
          type: string
        action:
          type: string
          enum: [help, decline]
      required:
        - requestId
        - action

    Agent:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        gender:
          type: string
        age:
          type: integer
        mood:
          type: number
        money:
          type: number
        personality:
          type: string
        socialization:
          type: number
        currentAction:
          type: string
        employerId:
          type: ["integer", "null"]
        isRetired:
          type: boolean
        careerLevel:
          type: integer
        jobTitle:
          type: string
      required:
        - id
        - name
        - gender
        - age
        - mood
        - money
        - personality
        - socialization
        - currentAction

    AgentNeeds:
      type: object
      properties:
        hunger:
          type: number
        comfort:
          type: number
        social:
          type: number
        health:
          type: number
        sleep:
          type: number
        education:
          type: number
        entertainment:
          type: number
        faith:
          type: number
        housingSafety:
          type: number
        financialSafety:
          type: number
        physicalSafety:
          type: number
        socialRating:
          type: number
        wellbeing:
          type: number
      required:
        - hunger
        - comfort
        - social
        - health
        - sleep
        - education
        - entertainment
        - faith
        - housingSafety
        - financialSafety
        - physicalSafety
        - socialRating
        - wellbeing

    AgentRelation:
      type: object
      properties:
        otherId:
          type: integer
        otherName:
          type: string
        friendshipLevel:
          type: number
      required:
        - otherId
        - otherName
        - friendshipLevel

    JobHistoryEntry:
      type: object
      properties:
        tick:
          type: integer
        event:
          type: string
          enum: [hired, fired, retired, quit, promoted]
        businessId:
          type: ["integer", "null"]
        businessName:
          type: ["string", "null"]
        duration:
          type: integer
      required:
        - tick
        - event
        - businessId
        - businessName

    AgentDetail:
      allOf:
        - $ref: "#/components/schemas/Agent"
        - type: object
          properties:
            needs:
              $ref: "#/components/schemas/AgentNeeds"
            relations:
              type: array
              items:
                $ref: "#/components/schemas/AgentRelation"
            recentActions:
              type: array
              items:
                type: string
              description: Last 10 actions taken by this agent
            isRetired:
              type: boolean
              description: Whether this agent has retired
            jobHistory:
              type: array
              items:
                $ref: "#/components/schemas/JobHistoryEntry"
              description: Most recent 20 job events for this agent
            employerName:
              type: ["string", "null"]
            jobStartTick:
              type: ["integer", "null"]
            jobTenure:
              type: ["integer", "null"]
            totalJobs:
              type: integer
            promotions:
              type: integer
            careerLevel:
              type: integer
            ambition:
              type: number
            targetCareerLevel:
              type: integer
            strength:
              type: number
            intelligence:
              type: number
          required:
            - needs
            - relations
            - recentActions
            - isRetired
            - jobHistory
            - employerName
            - jobStartTick
            - jobTenure
            - totalJobs
            - promotions
            - careerLevel
            - ambition
            - targetCareerLevel
            - strength
            - intelligence

    AgentListResponse:
      type: object
      properties:
        agents:
          type: array
          items:
            $ref: "#/components/schemas/Agent"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        totalPages:
          type: integer
      required:
        - agents
        - total
        - page
        - limit
        - totalPages

    Business:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        type:
          type: string
        balance:
          type: number
        productionRate:
          type: number
        employeeCount:
          type: integer
        maxEmployees:
          type: integer
        ownerId:
          type: ["integer", "null"]
        firedThisTick:
          type: integer
          description: Number of employees fired during the last simulation tick
        hiredThisTick:
          type: integer
          description: Number of employees hired during the last simulation tick
        productivityLevel:
          type: integer
      required:
        - id
        - name
        - type
        - balance
        - productionRate
        - employeeCount
        - firedThisTick
        - hiredThisTick
        - productivityLevel

    Good:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        basePrice:
          type: number
        currentPrice:
          type: number
        quality:
          type: number
        demand:
          type: number
        supply:
          type: number
      required:
        - id
        - name
        - basePrice
        - currentPrice
        - quality
        - demand
        - supply

    GovernmentState:
      type: object
      properties:
        budget:
          type: number
        totalTaxCollected:
          type: number
